on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['src/cli--release_created'] }}
      tag_name: ${{ steps.release.outputs['src/cli--tag_name'] }}
      version: ${{ steps.release.outputs['src/cli--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - uses: actions/checkout@v7
      - name: tag major and minor versions
        if: ${{ steps.release.outputs['src/cli--release_created'] }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -d v${{ steps.release.outputs['src/cli--major'] }}.${{ steps.release.outputs['src/cli--minor'] }} || true
          git push origin :v${{ steps.release.outputs['src/cli--major'] }}.${{ steps.release.outputs['src/cli--minor'] }} || true
          git tag -a v${{ steps.release.outputs['src/cli--major'] }}.${{ steps.release.outputs['src/cli--minor'] }} -m "Release v${{ steps.release.outputs['src/cli--major'] }}.${{ steps.release.outputs['src/cli--minor'] }}"
          git push origin v${{ steps.release.outputs['src/cli--major'] }}.${{ steps.release.outputs['src/cli--minor'] }}
          if [ "${{ steps.release.outputs['src/cli--major'] }}" != "0" ]; then
            git tag -d v${{ steps.release.outputs['src/cli--major'] }} || true
            git push origin :v${{ steps.release.outputs['src/cli--major'] }} || true
            git tag -a v${{ steps.release.outputs['src/cli--major'] }} -m "Release v${{ steps.release.outputs['src/cli--major'] }}"
            git push origin v${{ steps.release.outputs['src/cli--major'] }}
          fi

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      tag_name: ${{ needs.release-please.outputs.tag_name }}
      sign_macos: true
    secrets: inherit

  homebrew:
    needs: [release-please, build-release]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release download "$TAG" --pattern '*.tar.gz.sha256' --dir sha

      - uses: actions/checkout@v7
        with:
          repository: mfcollins3/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          ./scripts/update-homebrew-formula.sh "$TAG" "$VERSION" sha tap/Formula/naked-time.rb

      - name: Commit and push
        working-directory: tap
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Formula/naked-time.rb
          git commit --file - <<< "naked-time $VERSION"
          git push origin HEAD:main
