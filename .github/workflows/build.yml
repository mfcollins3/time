name: build

# Reusable workflow that builds Naked Time for every supported platform.
#
# * Without `tag_name` (CI mode), the packages are uploaded as workflow
#   artifacts.
# * With `tag_name` (release mode), the packages are attached to the GitHub
#   release for that tag.
# * With `sign_macos`, the macOS binary is signed with a Developer ID
#   Application certificate, and a Developer ID Installer-signed .pkg is built,
#   notarized by Apple and stapled. The .tar.gz contains the signed binary.

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to attach the build outputs to (empty for CI builds)
        type: string
        required: false
        default: ""
      sign_macos:
        description: Sign and notarize the macOS build (requires the Apple secrets)
        type: boolean
        required: false
        default: false
    secrets:
      MACOS_APP_CERTIFICATE_P12:
        description: Base64-encoded Developer ID Application certificate (.p12)
        required: false
      MACOS_APP_CERTIFICATE_PASSWORD:
        description: Password of the Developer ID Application .p12
        required: false
      MACOS_INSTALLER_CERTIFICATE_P12:
        description: Base64-encoded Developer ID Installer certificate (.p12)
        required: false
      MACOS_INSTALLER_CERTIFICATE_PASSWORD:
        description: Password of the Developer ID Installer .p12
        required: false
      APPLE_API_KEY_P8:
        description: Base64-encoded App Store Connect API key (.p8)
        required: false
      APPLE_API_KEY_ID:
        description: App Store Connect API key ID
        required: false
      APPLE_API_ISSUER_ID:
        description: App Store Connect API issuer ID
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            archive: zip
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            archive: tar.gz
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            archive: tar.gz
            arch: aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli -> target
          key: ${{ matrix.target }}

      - name: Install ALSA development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config

      - name: Build
        shell: bash
        working-directory: cli
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Import signing certificates
        if: runner.os == 'macOS' && inputs.sign_macos
        shell: bash
        env:
          APP_CERT_P12: ${{ secrets.MACOS_APP_CERTIFICATE_P12 }}
          APP_CERT_PASSWORD: ${{ secrets.MACOS_APP_CERTIFICATE_PASSWORD }}
          INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          INSTALLER_CERT_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          echo "$APP_CERT_P12" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$keychain" -P "$APP_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security import "$RUNNER_TEMP/installer.p12" -k "$keychain" -P "$INSTALLER_CERT_PASSWORD" \
            -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          existing_keychains=$(security list-keychains -d user | tr -d '"')
          # shellcheck disable=SC2086 # keychain paths contain no spaces on runners
          security list-keychains -d user -s "$keychain" $existing_keychains

          app_identity=$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          installer_identity=$(security find-identity -v "$keychain" \
            | sed -n 's/.*"\(Developer ID Installer:.*\)"/\1/p' | head -n 1)
          if [ -z "$app_identity" ] || [ -z "$installer_identity" ]; then
            echo "::error::Developer ID Application and Installer identities were not found"
            exit 1
          fi

          {
            echo "SIGNING_KEYCHAIN=$keychain"
            echo "APP_IDENTITY=$app_identity"
            echo "INSTALLER_IDENTITY=$installer_identity"
          } >> "$GITHUB_ENV"

      - name: Sign macOS binary
        if: runner.os == 'macOS' && inputs.sign_macos
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          exe="cli/target/$TARGET/release/naked-time"
          codesign --force --options runtime --timestamp --sign "$APP_IDENTITY" "$exe"
          codesign --verify --strict --verbose=2 "$exe"
          codesign -dvv "$exe"

      - name: Determine package version
        id: version
        shell: bash
        working-directory: cli
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [ -n "$TAG_NAME" ]; then
            echo "name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
            echo "name=v$version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          name="naked-time-${VERSION}-${TARGET}"
          exe="naked-time"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="naked-time.exe"; fi

          mkdir -p "dist/$name"
          cp "cli/target/$TARGET/release/$exe" README.md LICENSE.md "dist/$name/"

          cd dist
          if [ "$ARCHIVE" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - name: Build macOS installer package
        if: runner.os == 'macOS' && inputs.sign_macos
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Numeric version only: strip the leading "v" and any "-<sha>" suffix.
          pkg_version="${VERSION#v}"
          pkg_version="${pkg_version%%-*}"

          mkdir -p pkgroot/usr/local/bin
          cp "cli/target/$TARGET/release/naked-time" pkgroot/usr/local/bin/naked-time

          pkgbuild \
            --root pkgroot \
            --identifier software.naked.naked-time \
            --version "$pkg_version" \
            --install-location / \
            --sign "$INSTALLER_IDENTITY" \
            --timestamp \
            "dist/naked-time-${VERSION}-${TARGET}.pkg"
          pkgutil --check-signature "dist/naked-time-${VERSION}-${TARGET}.pkg"

      - name: Notarize and staple installer package
        if: runner.os == 'macOS' && inputs.sign_macos
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.name }}
          TARGET: ${{ matrix.target }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          pkg="dist/naked-time-${VERSION}-${TARGET}.pkg"
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$API_KEY_P8" | base64 --decode > "$key"

          result=$(xcrun notarytool submit "$pkg" \
            --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" \
            --wait --output-format json)
          echo "$result"
          status=$(echo "$result" | jq -r '.status')
          id=$(echo "$result" | jq -r '.id')

          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarization finished with status: $status"
            xcrun notarytool log "$id" \
              --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" || true
            exit 1
          fi

          xcrun stapler staple "$pkg"
          xcrun stapler validate "$pkg"
          spctl --assess --type install -vv "$pkg"

      - name: Build Linux packages
        if: runner.os == 'Linux'
        shell: bash
        working-directory: cli
        env:
          VERSION: ${{ steps.version.outputs.name }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          sudo apt-get install --yes rpm
          cargo install --locked cargo-deb cargo-generate-rpm

          cargo deb --no-build --target "$TARGET" --output "../dist/naked-time-${VERSION}-${ARCH}.deb"
          cargo generate-rpm --target "$TARGET" --output "../dist/naked-time-${VERSION}-${ARCH}.rpm"

          echo "--- deb ---"
          dpkg-deb --info "../dist/naked-time-${VERSION}-${ARCH}.deb"
          dpkg-deb --contents "../dist/naked-time-${VERSION}-${ARCH}.deb"
          dpkg-deb --field "../dist/naked-time-${VERSION}-${ARCH}.deb" Depends | grep -q libasound2
          dpkg-deb --contents "../dist/naked-time-${VERSION}-${ARCH}.deb" | grep -q usr/bin/naked-time

          echo "--- rpm ---"
          rpm_file="../dist/naked-time-${VERSION}-${ARCH}.rpm"
          if command -v rpm > /dev/null; then
            rpm -qip "$rpm_file"
            rpm -qRp "$rpm_file" | grep -q 'libasound.so.2'
            rpm -qlp "$rpm_file" | grep -q /usr/bin/naked-time
          fi

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            case "$f" in *.sha256) continue ;; esac
            if command -v sha256sum > /dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -l

      - name: Remove signing material
        if: always() && runner.os == 'macOS' && inputs.sign_macos
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

      - name: Upload workflow artifacts
        if: inputs.tag_name == ''
        uses: actions/upload-artifact@v7
        with:
          name: naked-time-${{ matrix.target }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

      - name: Attach to GitHub release
        if: inputs.tag_name != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
