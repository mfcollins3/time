name: build

# Reusable workflow that builds Naked Time for every supported platform.
#
# * Without `tag_name` (CI mode), the packages are uploaded as workflow
#   artifacts.
# * With `tag_name` (release mode), the packages are attached to the GitHub
#   release for that tag.

on:
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to attach the build outputs to (empty for CI builds)
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            archive: zip
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            archive: tar.gz
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            archive: tar.gz
            arch: aarch64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install ALSA development libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev pkg-config

      - name: Build
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Determine package version
        id: version
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          if [ -n "$TAG_NAME" ]; then
            echo "name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          else
            version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
            echo "name=v$version-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.name }}
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          name="naked-time-${VERSION}-${TARGET}"
          exe="naked-time"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="naked-time.exe"; fi

          mkdir -p "dist/$name"
          cp "target/$TARGET/release/$exe" README.md LICENSE.md "dist/$name/"

          cd dist
          if [ "$ARCHIVE" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - name: Build Linux packages
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.name }}
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          cargo install --locked cargo-deb cargo-generate-rpm

          cargo deb --no-build --target "$TARGET" --output "dist/naked-time-${VERSION}-${ARCH}.deb"
          cargo generate-rpm --target "$TARGET" --output "dist/naked-time-${VERSION}-${ARCH}.rpm"

          echo "--- deb ---"
          dpkg-deb --info "dist/naked-time-${VERSION}-${ARCH}.deb"
          dpkg-deb --contents "dist/naked-time-${VERSION}-${ARCH}.deb"
          dpkg-deb --field "dist/naked-time-${VERSION}-${ARCH}.deb" Depends | grep -q libasound2
          dpkg-deb --contents "dist/naked-time-${VERSION}-${ARCH}.deb" | grep -q usr/bin/naked-time

          echo "--- rpm ---"
          rpm_file="dist/naked-time-${VERSION}-${ARCH}.rpm"
          if command -v rpm > /dev/null; then
            rpm -qip "$rpm_file"
            rpm -qRp "$rpm_file" | grep -q 'libasound.so.2'
            rpm -qlp "$rpm_file" | grep -q /usr/bin/naked-time
          fi

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in *; do
            case "$f" in *.sha256) continue ;; esac
            if command -v sha256sum > /dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -l

      - name: Upload workflow artifacts
        if: inputs.tag_name == ''
        uses: actions/upload-artifact@v4
        with:
          name: naked-time-${{ matrix.target }}
          path: dist/*
          retention-days: 7
          if-no-files-found: error

      - name: Attach to GitHub release
        if: inputs.tag_name != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"
